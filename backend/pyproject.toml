[project]
name = "phonphai-chatbot-backend"
version = "0.1.0"
requires-python = ">=3.10"

[tool.ruff]
target-version = "py310"
line-length = 100
# Exclude auto-generated gRPC files
exclude = ["protos"]

[tool.ruff.lint]
# E/W = PEP8, F = Pyflakes, I = Isort, T20 = No Prints, B = Bugbear
select = ["E", "W", "F", "I", "T20", "B"]
# E501: Ignore line length (formatter handles it)
# W291: Ignore trailing whitespace (formatter handles it)
ignore = ["E501", "W291"]

# Allow FastAPI dependency injection calls
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends", 
    "fastapi.params.Depends", 
    "fastapi.File", 
    "fastapi.Form", 
    "fastapi.Query"
]

[tool.ruff.lint.isort]
known-first-party = ["services", "settings"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"