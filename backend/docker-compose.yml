services:
  # --- Databases ---
  postgres:
    build:
      context: .
      dockerfile: ./services/sql_data/Dockerfile
    environment:
      - POSTGRES_DB=phonphai
      - POSTGRES_USER=phonphai
      - POSTGRES_PASSWORD=phonphai
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phonphai -d phonphai"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - rag_net

  mongo:
    image: mongo:latest
    volumes:
      - ./data/mongo_data:/data/db
    networks:
      - rag_net

  qdrant:
    image: qdrant/qdrant:v1.10.1
    ports:
      - "6333:6333"
    volumes:
      - ./data/qdrant_data:/qdrant/storage
    networks:
      - rag_net

  # --- Microservices ---
  retriever:
    build:  
      context: .
      dockerfile: ./services/retriever/Dockerfile
      args:
        EMBEDDING_MODEL_NAME: intfloat/multilingual-e5-large
        RERANK_MODEL_NAME: BAAI/bge-reranker-v2-m3
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - MONGO_URI=mongodb://mongo:27017
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - ANONYMIZED_TELEMETRY=False
      - EMBEDDING_MODEL_NAME=intfloat/multilingual-e5-large
      - RERANK_MODEL_NAME=BAAI/bge-reranker-v2-m3
      - HYBRID_SEMANTIC_WEIGHT=0.6
      - HYBRID_BM25_WEIGHT=0.4
      - RETRIEVAL_K=20
      - RERANK_TOP_K=10
      - CHUNK_SIZE=1000
      - CHUNK_OVERLAP=200
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - LANGCHAIN_TRACING_V2=true
      - LANGCHAIN_ENDPOINT=https://api.smith.langchain.com
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY}
      - LANGCHAIN_PROJECT=phonphai-phaser
    restart: unless-stopped     
    healthcheck:              
      test: ["CMD", "python", "-c", "import socket; socket.socket(socket.AF_INET, socket.SOCK_STREAM).connect(('localhost', 50051))"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      qdrant:
        condition: service_started
    networks:
      - rag_net

  agent:
    build: 
      context: .
      dockerfile: ./services/agent/Dockerfile
    environment:
      - RETRIEVER_HOST=retriever:50051
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=phonphai
      - POSTGRES_USER=phonphai
      - POSTGRES_PASSWORD=phonphai
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - ANONYMIZED_TELEMETRY=False
      - LANGCHAIN_TRACING_V2=true
      - LANGCHAIN_ENDPOINT=https://api.smith.langchain.com
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY}
      - LANGCHAIN_PROJECT=phonphai-agent
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.socket(socket.AF_INET, socket.SOCK_STREAM).connect(('localhost', 50052))"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      retriever:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - rag_net

  api-gateway:
    build:
      context: .
      dockerfile: ./services/api-gateway/Dockerfile
    ports:
      - "8080:8000"
    environment:
      - AGENT_HOST=agent:50052
      - RETRIEVER_HOST=retriever:50051
      - ANONYMIZED_TELEMETRY=False
      - MONGO_URI=mongodb://mongo:27017
      - MONGO_DB=rag_db
      - JWT_SECRET=${JWT_SECRET:-please-change-me}
      - JWT_ALGORITHM=HS256
      - JWT_EXPIRES_HOURS=168
      - INITIAL_ADMIN_USERNAME=${INITIAL_ADMIN_USERNAME:-admin}
      - INITIAL_ADMIN_PASSWORD=${INITIAL_ADMIN_PASSWORD:-a1234567}
      - INITIAL_USER_USERNAME=${INITIAL_USER_USERNAME:-user}
      - INITIAL_USER_PASSWORD=${INITIAL_USER_PASSWORD:-a1234567}
      - INITIAL_USER_STAFF_ID=${INITIAL_USER_STAFF_ID:-13266}
    restart: unless-stopped
    depends_on:
      retriever:
        condition: service_healthy
      agent:
        condition: service_healthy
      mongo:
        condition: service_started
    networks:
      - rag_net

networks:
  rag_net:
    driver: bridge
