services:
  # --- Databases ---
  mongo:
    image: mongo:latest
    volumes:
      - ./data/mongo_data:/data/db
    networks:
      - rag_net

  chroma:
    image: chromadb/chroma:0.5.3
    volumes:
      - ./data/chroma_data:/chroma/chroma
    networks:
      - rag_net
    environment:
      - ANONYMIZED_TELEMETRY=False

  # --- Microservices ---
  retriever:
    build: 
      context: .
      dockerfile: ./services/retriever/Dockerfile
    environment:
      - MONGO_URI=mongodb://mongo:27017
      - CHROMA_HOST=chroma
      - ANONYMIZED_TELEMETRY=False
    restart: unless-stopped     
    healthcheck:              
      test: ["CMD", "python", "-c", "import socket; socket.socket(socket.AF_INET, socket.SOCK_STREAM).connect(('localhost', 50051))"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rag_net

  agent:
    build: 
      context: .
      dockerfile: ./services/agent/Dockerfile
    environment:
      - RETRIEVER_HOST=retriever:50051
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.socket(socket.AF_INET, socket.SOCK_STREAM).connect(('localhost', 50052))"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      retriever:
        condition: service_healthy
    networks:
      - rag_net

  api-gateway:
    build:
      context: .
      dockerfile: ./services/api-gateway/Dockerfile
    ports:
      - "8080:8000"
    environment:
      - AGENT_HOST=agent:50052
      - RETRIEVER_HOST=retriever:50051
    restart: unless-stopped      
    depends_on:
      retriever:
        condition: service_healthy
      agent:
        condition: service_healthy
    networks:
      - rag_net

networks:
  rag_net:
    driver: bridge