[project]
name = "phonphai-evaluation"
version = "0.1.0"
description = "Evaluation and retrieval-tuning tooling for Phonphai"
requires-python = ">=3.10"
dependencies = [
    "langchain>=0.2.0",
    "langchain-community>=0.3.28",
    "langchain-huggingface",
    "langchain-text-splitters>=0.2.0",
    "langsmith",
    "loguru>=0.7.2",
    "numpy>=2.0.0",
    "openpyxl",
    "protobuf>=4.25.3",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.2.0",
    "pymongo==4.6.1",
    "pypdf==4.0.1",
    "qdrant-client>=1.9.1",
    "rank-bm25",
    "requests>=2.31.0",
    "sentence-transformers==2.3.1",
    "tenacity>=8.2.0",
    "torch>=2.5.0",
    "torchvision>=0.20.0",
    "torchaudio>=2.5.0",
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu121" }]
torchvision = [{ index = "pytorch-cu121" }]
torchaudio = [{ index = "pytorch-cu121" }]

[tool.uv]
package = false
